compliance_program:
  published: false
  note: >-
    No trust center, compliance page or named certification (SOC 2, ISO 27001,
    PCI DSS, HIPAA, FedRAMP) was found on shopback.com, corporate.shopback.com,
    docs.shopback.com or any subdomain. corporate.shopback.com is a single-page
    app that answers HTTP 200 with the same homepage for every path, so its
    /trust-safety/* links do not resolve to distinct served documents. No
    `Compliance` pointer was wired for this reason.
