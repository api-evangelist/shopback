summary: >-
  ShopBack's published APIs are plain REST/JSON over TLS with two proprietary
  auth models (merchant JWT bearer, and an SB1-HMAC-SHA256 request signature).
  No OAuth 2.0, OIDC, FAPI, PSD2, Open Banking or other regulated-payments
  profile is asserted or evidenced, and no compliance certification is published
  on any ShopBack host.
standards:
- id: rest
  conforms: true
  evidence: >-
    "This API is organized around REST (REpresentational State Transfer) and uses
    predictable, resource-oriented URLs" — https://docs.shopback.com/docs/quickstart-api
- id: openapi-3.0
  conforms: true
  evidence: >-
    Both APIs are documented with OpenAPI 3.0.1 definitions published per
    operation on docs.shopback.com reference pages.
- id: tls-1.2-minimum
  conforms: true
  evidence: >-
    "All communication needs to be secured using HTTPS with TLS 1.2 (or greater)"
    — https://docs.shopback.com/docs/quickstart-api; live probe observed TLSv1.3
    on www.shopback.com, docs.shopback.com and prod-merchant-service.hoolah.co.
- id: http-bearer-jwt
  conforms: true
  evidence: >-
    components.securitySchemes.bearer (type http, scheme bearer, bearerFormat JWT)
    in openapi/shopback-online-payments-openapi.yml.
- id: hmac-request-signing
  conforms: true
  evidence: >-
    SB1-HMAC-SHA256 signature over method, content-type, ISO-8601 UTC date, fully
    qualified path and a SHA-256 digest of the alphabetically sorted JSON body —
    https://docs.shopback.com/reference/generating-hmac-signature
- id: idempotency-key
  conforms: true
  evidence: >-
    X-ShopBack-Idempotent-Id (UUID v4) required on state-changing operations —
    https://docs.shopback.com/reference/key-concepts
- id: iso-8601
  conforms: true
  evidence: Date header and all timestamps are ISO-8601 UTC.
- id: iso-3166-1-alpha
  conforms: true
  evidence: In-Store Payments API country codes use ISO-3166-1 alpha (change log v1.2).
- id: iso-4217
  conforms: true
  evidence: Currency fields use three-letter currency codes (SGD, MYR, THB, HKD).
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    Errors use a proprietary {statusCode, error, message} envelope over
