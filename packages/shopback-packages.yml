summary: >-
  ShopBack publishes no first-party client SDK in any public package registry.
  npm, PyPI, Packagist, RubyGems, Maven Central, NuGet and pkg.go.dev were all
  searched — the only "shopback" hits on npm are third-party candidate exercises
  from ShopBack's Node.js SEO coding challenge, not ShopBack-published libraries.
  What ShopBack does ship is a set of first-party e-commerce PLATFORM PLUGINS for
  ShopBack Pay, distributed as downloadable archives from the developer hub rather
  than through a package registry, plus a Shopify app.
