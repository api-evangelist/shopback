summary: >-
  ShopBack does not run a single dated developer changelog. Two partial change
  surfaces exist: a document-version change log embedded in the In-Store Payments
  API getting-started page, and a plugin-version table for the e-commerce payment
  plugins. Every docs page also carries an updatedAt timestamp, which is the only
  signal of change on the Online Payments API.
scheme: document version (In-Store), unversioned document + page updatedAt (Online)

