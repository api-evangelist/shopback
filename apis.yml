- aid: shopback:shopback-in-store-payments-api
  name: ShopBack In-Store Payments API
  description: >-
    The ShopBack In-Store Payments API (v1.4) accepts ShopBack Pay at the point of
    sale and in customer-facing apps and websites. It supports merchant-presented
    dynamic QR, customer-presented QR scanning and URL redirect flows, with order
    create, scan, status, refund and cancel operations plus a merchant-implemented
    payment-notification webhook. Requests are signed with SB1-HMAC-SHA256.
  humanURL: https://docs.shopback.com/reference/in-store-getting-started
  baseURL: https://integrations.shopback.sg/posi
