aid: shopback
name: ShopBack
description: >-
  ShopBack is a Singapore-headquartered shopping, rewards and payments platform
  founded in 2014, operating across 13 markets in Asia-Pacific, Europe and the
  United States with more than 20 million members and 20,000 merchant partners.
  Alongside its consumer cashback and discovery app, ShopBack runs a merchant-facing
  payments business — ShopBack Pay and ShopBack PayLater — and publishes a public
  developer hub at docs.shopback.com covering two REST APIs. The Online Payments
  API (v2.0, also called the Online Bespoke API) handles merchant login, order
  initiation, order status, refunds, and a tokenized-payments surface for account
  linking, pre-authorization hold/capture/void, immediate charge and cashback-balance
  lookup. The In-Store Payments API (v1.4) covers merchant-presented and
  customer-presented QR ordering, order status, refunds, cancellations, and a
  payment-notification webhook for point-of-sale and customer-facing app checkout.
  Both are HMAC- or JWT-authenticated over HTTPS/TLS 1.2+, support an
  X-ShopBack-Idempotent-Id idempotency header, and ship e-commerce plugins for
  Shopify, WooCommerce, Magento, PrestaShop, EasyStore and Salesforce Commerce Cloud.
