apis:
- aid: shopback:shopback-online-payments-api
  name: ShopBack Online Payments API
  description: >-
    The ShopBack Online Payments API (v2.0), also documented as the Online Bespoke
    API, lets merchants add ShopBack Pay and ShopBack PayLater to any web or app
    checkout. It covers merchant JWT login, order initiation, order status lookup
    and full or partial refunds, plus a tokenized-payments surface — link sessions,
    auth-code exchange for a reusable payment token, token revocation, cashback
    balance, pre-authorization create/get/capture/void and immediate charge.
  humanURL: https://docs.shopback.com/reference/initiateorder
  baseURL: https://prod-merchant-service.hoolah.co/merchant
  tags:
