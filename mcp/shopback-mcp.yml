agent_safety_notes:
- Fourteen of the nineteen candidate tools move money or change payment state. Any real server should
  require the X-ShopBack-Idempotent-Id header on create_online_order, create_pre_auth, immediate_charge
  and create_instore_qr_order, and should treat capture, refund, void and cancel as human-in-the-loop
  operations.
- ShopBack publishes no OAuth scopes or consent model for merchant credentials, so tool-level authorization
  would have to be enforced by the MCP server itself.
