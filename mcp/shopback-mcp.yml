summary: No official hosted or remote Model Context Protocol server was found for ShopBack. Searched the
  developer hub (docs.shopback.com, including its llms.txt index), the corporate site, the ShopBack GitHub
  organisation and the public MCP registries — nothing published, and no /mcp endpoint responds on any
  ShopBack host. The tool set below is DERIVED from ShopBack's own published OpenAPI operations as a proposal
  only. It is NOT published by ShopBack, and no `MCPServer` pointer was wired in apis.yml.
server: null
transport: null
url: null
auth:
  online_payments:
    type: http bearer
    detail: merchant JWT from POST /auth/login, 8 hour lifetime
  in_store_payments:
    type: hmac
    detail: 'Authorization: SB1-HMAC-SHA256 <accessKeyId>:<hmacSignature>'
  note: Both surfaces are merchant-secret authenticated with no scoping or consent model, so any real
    MCP server would need to run server-side under a merchant identity, never in an end-user agent.
