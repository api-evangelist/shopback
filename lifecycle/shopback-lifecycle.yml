go_live:
  process: >-
    Merchants must complete every sandbox test scenario before production access.
    ShopBack publishes a sandbox test-scenario spreadsheet, then runs its own
    production verification round after the merchant reports go-live.
  contact: fs.integration@shopback.com
  docs: https://docs.shopback.com/docs/integration-verification
  payment_limits_at_go_live:
    minimum: 1 SGD / MYR
    maximum: 1000 SGD / MYR

roadmap:
